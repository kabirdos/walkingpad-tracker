<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WalkingPad · Telemetry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
      /* WalkingPad · Telemetry — editorial sport, light, on warm paper.
         Type: Fraunces (display, variable opsz), Space Grotesk (body),
         JetBrains Mono (instrument numerals). Single persimmon accent. */

      :root {
        --bg: #f4efe5; /* warm cream paper */
        --paper: #fbf7ee; /* card surface (slightly lighter) */
        --ink: #161310; /* warm near-black */
        --muted: #7a736b; /* warm muted gray */
        --line: rgba(22, 19, 16, 0.12);
        --line-soft: rgba(22, 19, 16, 0.06);
        --signal: #de3a1a; /* persimmon — active, accent, go */
        --signal-soft: rgba(222, 58, 26, 0.1);
        --signal-glow: rgba(222, 58, 26, 0.22);
        --ember: #2a2724; /* deep ink — destructive (stop) */
        --radius: 9px;
        --mono: "JetBrains Mono", ui-monospace, monospace;
        --sans: "Space Grotesk", system-ui, sans-serif;
        --serif: "Fraunces", Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--sans);
        font-size: 13.5px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--bg);
        background-image: radial-gradient(
          circle at 1px 1px,
          rgba(22, 19, 16, 0.045) 1px,
          transparent 0
        );
        background-size: 5px 5px;
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 26px 22px 56px;
      }

      /* ---- Header ---- */
      header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding-bottom: 16px;
        margin-bottom: 18px;
        gap: 16px;
      }
      .brand h1 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 600;
        font-variation-settings:
          "opsz" 96,
          "SOFT" 30,
          "WONK" 0;
        font-size: 26px;
        letter-spacing: -0.018em;
        line-height: 1;
        color: var(--ink);
      }
      .brand .tick {
        font-family: var(--serif);
        font-style: italic;
        font-variation-settings:
          "opsz" 144,
          "SOFT" 80;
        color: var(--signal);
        margin: 0 0.5px;
        font-weight: 700;
      }
      .brand small {
        display: block;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-top: 6px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        font-family: var(--mono);
        font-size: 10.5px;
        letter-spacing: 0.05em;
        color: var(--muted);
        white-space: nowrap;
      }
      .status .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--muted);
      }
      .status.online {
        color: var(--ink);
        border-color: var(--ink);
        background: var(--paper);
      }
      .status.online .dot {
        background: var(--signal);
        box-shadow: 0 0 0 3px var(--signal-glow);
      }

      /* ---- Grid ---- */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .panel.full {
        grid-column: 1 / -1;
      }
      @media (max-width: 560px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .wrap {
          padding: 20px 16px 48px;
        }
      }

      .panel {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px 16px 18px;
        position: relative;
      }

      .label {
        font-family: var(--mono);
        font-size: 9.5px;
        color: var(--muted);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin-bottom: 12px;
      }

      /* ---- Cockpit ---- */
      .cockpit {
        grid-column: 1 / -1;
      }
      .cockpit .label {
        display: inline-block;
        margin-bottom: 0;
      }
      .cockpit .eq {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 9px;
        margin-left: 8px;
        vertical-align: -1px;
        opacity: 0.32;
      }
      .cockpit .eq span {
        width: 2px;
        background: var(--ink);
        display: inline-block;
        height: 32%;
        animation: bar 1.05s ease-in-out infinite;
      }
      .cockpit .eq span:nth-child(2) {
        animation-delay: 0.1s;
        height: 58%;
      }
      .cockpit .eq span:nth-child(3) {
        animation-delay: 0.2s;
        height: 80%;
      }
      .cockpit .eq span:nth-child(4) {
        animation-delay: 0.3s;
        height: 44%;
      }
      .cockpit .eq span:nth-child(5) {
        animation-delay: 0.4s;
        height: 66%;
      }
      @keyframes bar {
        50% {
          height: 100%;
        }
      }
      .cockpit.moving .eq {
        opacity: 1;
      }
      .cockpit.moving .eq span {
        background: var(--signal);
      }

      .readout {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 6px;
      }
      .readout .big {
        font-family: var(--mono);
        font-size: 48px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.025em;
        line-height: 1;
        color: var(--ink);
        transition: color 0.25s ease;
      }
      .cockpit.moving .readout .big {
        color: var(--signal);
      }
      .readout .unit {
        font-family: var(--sans);
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        font-weight: 600;
      }
      .state-tag {
        display: inline-block;
        margin-top: 4px;
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.16em;
        color: var(--muted);
        text-transform: uppercase;
      }
      .cockpit.moving .state-tag {
        color: var(--signal);
      }

      /* Sub-cells */
      .sub {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        margin-top: 16px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .sub .cell {
        padding: 0 12px;
        border-right: 1px solid var(--line);
      }
      .sub .cell:first-child {
        padding-left: 0;
      }
      .sub .cell:last-child {
        border-right: none;
        padding-right: 0;
      }
      .sub .v {
        font-family: var(--mono);
        font-size: 15.5px;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
        letter-spacing: -0.005em;
      }
      .sub .k {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--muted);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-top: 3px;
      }

      /* ---- Controls ---- */
      .controls {
        margin-top: 16px;
      }
      .btn-row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 7px;
        margin-bottom: 10px;
      }
      button {
        font-family: var(--sans);
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 8px 10px;
        background: var(--paper);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
        transition:
          background 0.14s ease,
          color 0.14s ease,
          border-color 0.14s ease,
          transform 0.08s ease;
      }
      button:hover:not(:disabled) {
        background: rgba(22, 19, 16, 0.04);
        border-color: rgba(22, 19, 16, 0.45);
      }
      button:active:not(:disabled) {
        transform: translateY(0.5px);
      }
      button:disabled {
        opacity: 0.32;
        cursor: not-allowed;
      }

      button.go {
        border-color: var(--signal);
        color: var(--signal);
        background: var(--signal-soft);
      }
      button.go:hover:not(:disabled) {
        background: var(--signal);
        color: var(--paper);
      }
      button.halt {
        border-color: var(--ember);
        color: var(--ember);
      }
      button.halt:hover:not(:disabled) {
        background: var(--ember);
        color: var(--paper);
      }

      /* ---- Speeds ---- */
      .speeds {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        align-items: center;
      }
      .speeds .label {
        margin: 0 6px 0 0 !important;
        border: none !important;
        font-size: 9.5px !important;
      }
      .speeds .preset {
        flex: 0 0 auto;
        padding: 5px 9px;
        font-size: 11px;
        font-family: var(--mono);
        letter-spacing: 0.01em;
        text-transform: none;
        font-weight: 500;
        color: var(--ink);
        border-radius: 5px;
        background: transparent;
        border-color: var(--line);
      }
      .speeds .preset.nudge {
        background: transparent;
        color: var(--muted);
        border-color: var(--line-soft);
      }
      .speeds .preset.sel {
        background: var(--ink);
        color: var(--paper);
        border-color: var(--ink);
      }
      .speeds .preset:hover:not(:disabled):not(.sel) {
        border-color: var(--ink);
      }

      /* ---- Today panel ---- */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px 18px;
      }
      @media (max-width: 560px) {
        .stats {
          grid-template-columns: 1fr 1fr;
        }
      }
      .stat .v {
        font-family: var(--mono);
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.015em;
        color: var(--ink);
        display: flex;
        align-items: baseline;
        gap: 3px;
      }
      .stat .v .u {
        font-size: 10.5px;
        color: var(--muted);
        font-family: var(--sans);
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-left: 2px;
      }
      .stat .k {
        font-family: var(--mono);
        font-size: 9px;
        color: var(--muted);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        margin-top: 2px;
      }
      .stat.streak .v {
        color: var(--signal);
      }

      /* ---- Trends ---- */
      .trend-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .toggles {
        display: inline-flex;
        align-items: center;
        gap: 2px;
      }
      .toggles .t {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--muted);
        padding: 3px 7px;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition:
          color 0.14s ease,
          border-color 0.14s ease;
      }
      .toggles .t:hover {
        color: var(--ink);
      }
      .toggles .t.sel {
        color: var(--ink);
        border-color: var(--line);
      }
      .chart-box {
        height: 170px;
        position: relative;
      }

      /* ---- Sessions ---- */
      .sessions .row {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        gap: 12px;
        padding: 9px 0;
        border-top: 1px dashed var(--line);
        align-items: baseline;
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .sessions .row:first-child {
        border-top: none;
        padding-top: 0;
      }
      .sessions .row .time {
        font-size: 10.5px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
      .sessions .row .dist {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink);
        order: 2;
      }
      .sessions .row .meta {
        font-size: 10.5px;
        color: var(--muted);
        letter-spacing: 0.01em;
      }
      .sessions .empty {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 0.04em;
        padding: 6px 0;
      }

      /* ---- Stagger reveal ---- */
      .panel {
        opacity: 0;
        transform: translateY(6px);
        animation: rise 0.55s cubic-bezier(0.21, 0.66, 0.21, 1) forwards;
      }
      .delay1 {
        animation-delay: 0.04s;
      }
      .delay2 {
        animation-delay: 0.1s;
      }
      .delay3 {
        animation-delay: 0.16s;
      }
      .delay4 {
        animation-delay: 0.22s;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
        .panel {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <h1>Walking<span class="tick">·</span>Pad</h1>
          <small id="today-date">—</small>
        </div>
        <div class="status" id="status-pill">
          <span class="dot"></span><span id="status-text">connecting</span>
        </div>
      </header>

      <div class="grid">
        <!-- Cockpit -->
        <section class="panel cockpit delay1" id="cockpit">
          <div class="label">Live</div>
          <div class="eq">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
          <div class="readout">
            <div class="big" id="live-speed">0.0</div>
            <div class="unit">mph</div>
          </div>
          <div class="state-tag" id="state-tag">standby</div>

          <div class="sub">
            <div class="cell">
              <div class="v" id="live-dist">0.00</div>
              <div class="k">mi</div>
            </div>
            <div class="cell">
              <div class="v" id="live-steps">0</div>
              <div class="k">steps</div>
            </div>
            <div class="cell">
              <div class="v" id="live-time">0:00</div>
              <div class="k">elapsed</div>
            </div>
          </div>

          <div class="controls">
            <div class="btn-row">
              <button id="btn-wake">Wake</button>
              <button class="go" id="btn-start">Start</button>
              <button class="halt" id="btn-stop">Stop</button>
            </div>
            <div class="speeds" id="speeds">
              <span class="label" style="margin: 0 8px 0 0; border: none"
                >Speed</span
              >
              <button class="preset nudge" data-delta="-0.1">&minus;0.1</button>
              <button class="preset" data-mph="1.4">1.4</button>
              <button class="preset" data-mph="1.6">1.6</button>
              <button class="preset" data-mph="1.8">1.8</button>
              <button class="preset" data-mph="2.0">2.0</button>
              <button class="preset" data-mph="2.2">2.2</button>
              <button class="preset" data-mph="2.4">2.4</button>
              <button class="preset nudge" data-delta="0.1">+0.1</button>
            </div>
          </div>
        </section>

        <!-- Today -->
        <section class="panel delay2 full">
          <div class="label">Today</div>
          <div class="stats">
            <div class="stat">
              <div class="v" id="t-dist">0.00<span class="u">mi</span></div>
              <div class="k">distance</div>
            </div>
            <div class="stat">
              <div class="v" id="t-steps">0</div>
              <div class="k">steps</div>
            </div>
            <div class="stat">
              <div class="v" id="t-mins">0<span class="u">min</span></div>
              <div class="k">active</div>
            </div>
            <div class="stat streak">
              <div class="v" id="t-streak">0<span class="u">d</span></div>
              <div class="k">streak</div>
            </div>
          </div>
        </section>

        <!-- Trends -->
        <section class="panel delay3 full">
          <div class="trend-head">
            <div class="label" style="margin-bottom: 0">Trends</div>
            <div class="toggles">
              <span class="t metric sel" data-metric="distance">Distance</span>
              <span class="t metric" data-metric="steps">Steps</span>
              <span style="width: 14px"></span>
              <span class="t range sel" data-range="week">7d</span>
              <span class="t range" data-range="month">30d</span>
            </div>
          </div>
          <div class="chart-box"><canvas id="chart"></canvas></div>
        </section>

        <!-- Sessions -->
        <section class="panel delay4 full sessions">
          <div class="label">Today's sessions</div>
          <div
            style="
              font-family: var(--mono);
              font-size: 11px;
              color: var(--muted);
              letter-spacing: 0.03em;
              margin: -8px 0 14px;
            "
          >
            Each row is one separate walk &middot; the Today panel above is
            their sum
          </div>
          <div id="session-list">
            <div class="empty">No sessions yet today.</div>
          </div>
        </section>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let connected = false;
      let curMetric = "distance";
      let curRange = "week";
      let chart;

      const MI = 0.621371; // km -> miles, and km/h -> mph
      const fmtInt = (n) => Math.round(n).toLocaleString("en-US");
      const fmtMi = (m) => ((m / 1000) * MI).toFixed(2); // metres -> miles
      const mph = (kmh) => (kmh || 0) * MI;
      function fmtClock(s) {
        s = Math.max(0, Math.round(s));
        const m = Math.floor(s / 60),
          ss = s % 60;
        return m + ":" + String(ss).padStart(2, "0");
      }

      async function api(path, opts) {
        const r = await fetch(path, opts);
        if (!r.ok) throw new Error(path + " -> " + r.status);
        return r.json();
      }

      async function pollStatus() {
        try {
          const s = await api("/status");
          connected = !!s.connected;
          const moving = (s.speed_kmh || 0) > 0;

          $("live-speed").textContent = mph(s.speed_kmh).toFixed(1);
          $("live-dist").textContent = fmtMi(s.distance_m || 0);
          $("live-steps").textContent = fmtInt(s.steps || 0);
          $("live-time").textContent = fmtClock(s.elapsed_s || 0);

          $("cockpit").classList.toggle("moving", moving);
          $("state-tag").textContent = !connected
            ? "asleep"
            : moving
              ? "walking"
              : "standby";

          const pill = $("status-pill");
          pill.classList.toggle("online", connected);
          // Disconnected here means the daemon can't see the pad over BLE —
          // it's asleep (radio off) and only the physical remote can wake it.
          $("status-text").textContent = connected
            ? "connected"
            : "asleep · use remote";

          setControlsEnabled(connected);
        } catch (e) {
          connected = false;
          $("status-pill").classList.remove("online");
          $("status-text").textContent = "offline";
          $("state-tag").textContent = "offline";
          setControlsEnabled(false);
        }
      }

      function setControlsEnabled(on) {
        $("btn-wake").disabled = !on;
        $("btn-start").disabled = !on;
        $("btn-stop").disabled = !on;
        document
          .querySelectorAll("#speeds .preset")
          .forEach((b) => (b.disabled = !on));
      }

      async function loadToday() {
        try {
          const t = await api("/today");
          $("today-date").textContent = t.date || "";
          $("t-dist").innerHTML =
            fmtMi(t.distance_m || 0) + '<span class="u">mi</span>';
          $("t-steps").textContent = fmtInt(t.steps || 0);
          $("t-mins").innerHTML =
            Math.round((t.duration_s || 0) / 60) + '<span class="u">min</span>';
          $("t-streak").innerHTML =
            (t.streak || 0) + '<span class="u">d</span>';
        } catch (e) {}
      }

      async function loadSessions() {
        try {
          const data = await api("/sessions");
          const list = $("session-list");
          if (!data.sessions || !data.sessions.length) {
            list.innerHTML = '<div class="empty">No sessions yet today.</div>';
            return;
          }
          list.innerHTML = data.sessions
            .map((s) => {
              const t = new Date(s.start_ts * 1000).toLocaleTimeString(
                "en-US",
                { hour: "2-digit", minute: "2-digit" },
              );
              return `<div class="row">
        <span class="time">${t}</span>
        <span class="dist">${fmtMi(s.distance_m)} mi</span>
        <span class="meta">${fmtInt(s.steps)} steps · ${Math.round(s.duration_s / 60)} min</span>
        <span class="meta">max ${mph(s.max_speed_kmh).toFixed(1)}</span>
      </div>`;
            })
            .join("");
        } catch (e) {}
      }

      async function loadChart() {
        try {
          const data = await api("/history?range=" + curRange);
          const days = data.days || [];
          const labels = days.map((d) => d.day.slice(5));
          const values = days.map((d) =>
            curMetric === "distance" ? (d.distance_m / 1000) * MI : d.steps,
          );
          const ctx = $("chart").getContext("2d");
          const grad = ctx.createLinearGradient(0, 0, 0, 230);
          grad.addColorStop(0, "rgba(222,58,26,0.92)");
          grad.addColorStop(1, "rgba(222,58,26,0.10)");

          if (chart) chart.destroy();
          chart = new Chart(ctx, {
            type: "bar",
            data: {
              labels,
              datasets: [
                {
                  data: values,
                  backgroundColor: grad,
                  borderRadius: 5,
                  maxBarThickness: 38,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              layout: { padding: { left: 4, right: 4, top: 6 } },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: "#161310",
                  borderColor: "rgba(222,58,26,0.45)",
                  borderWidth: 1,
                  titleFont: { family: "JetBrains Mono" },
                  bodyFont: { family: "JetBrains Mono" },
                  callbacks: {
                    label: (c) =>
                      curMetric === "distance"
                        ? c.parsed.y.toFixed(2) + " mi"
                        : fmtInt(c.parsed.y) + " steps",
                  },
                },
              },
              scales: {
                x: {
                  grid: { display: false },
                  ticks: {
                    color: "#7a736b",
                    font: { family: "JetBrains Mono", size: 10 },
                  },
                },
                y: {
                  grid: { color: "rgba(22,19,16,0.07)" },
                  ticks: {
                    color: "#7a736b",
                    font: { family: "JetBrains Mono", size: 10 },
                  },
                  beginAtZero: true,
                },
              },
            },
          });
        } catch (e) {}
      }

      // Controls
      $("btn-wake").onclick = () => control("/control/wake");
      $("btn-start").onclick = () => control("/control/start");
      $("btn-stop").onclick = () => control("/control/stop");
      let setMph = 1.5; // last speed we asked for, in mph
      function applySpeed(mphVal) {
        setMph = Math.min(3.7, Math.max(0.4, Math.round(mphVal * 10) / 10));
        control("/control/speed", { kmh: setMph / MI }); // pad speaks km/h
        document.querySelectorAll("#speeds .preset").forEach((x) => {
          x.classList.toggle(
            "sel",
            !!(x.dataset.mph && parseFloat(x.dataset.mph) === setMph),
          );
        });
      }
      document.querySelectorAll("#speeds .preset").forEach((b) => {
        b.onclick = () => {
          if (b.dataset.delta) {
            const live = parseFloat($("live-speed").textContent) || 0; // mph
            applySpeed(
              (live > 0 ? live : setMph) + parseFloat(b.dataset.delta),
            );
          } else {
            applySpeed(parseFloat(b.dataset.mph));
          }
        };
      });
      async function control(path, body) {
        try {
          await api(path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: body ? JSON.stringify(body) : undefined,
          });
          pollStatus();
        } catch (e) {}
      }

      // Toggles
      document.querySelectorAll(".toggles .metric").forEach(
        (t) =>
          (t.onclick = () => {
            document
              .querySelectorAll(".toggles .metric")
              .forEach((x) => x.classList.remove("sel"));
            t.classList.add("sel");
            curMetric = t.dataset.metric;
            loadChart();
          }),
      );
      document.querySelectorAll(".toggles .range").forEach(
        (t) =>
          (t.onclick = () => {
            document
              .querySelectorAll(".toggles .range")
              .forEach((x) => x.classList.remove("sel"));
            t.classList.add("sel");
            curRange = t.dataset.range;
            loadChart();
          }),
      );

      // Boot + loops
      pollStatus();
      loadToday();
      loadSessions();
      loadChart();
      setInterval(pollStatus, 1000);
      setInterval(() => {
        loadToday();
        loadSessions();
      }, 15000);
      setInterval(loadChart, 60000);
    </script>
  </body>
</html>
